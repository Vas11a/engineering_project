name: Quality checks

on:
  push:
  pull_request:

jobs:
  applications:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        application: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: ${{ matrix.application }}/package-lock.json
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lexilo_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: lexilo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexilo_test -d lexilo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_UNPOOLED: postgresql://lexilo_test:test-only-password@localhost:5432/lexilo_test
      TEST_DATABASE_URL: postgresql://lexilo_test:test-only-password@localhost:5432/lexilo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:deploy
      - run: npm run test:integration
